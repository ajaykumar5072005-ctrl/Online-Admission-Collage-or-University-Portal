<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Syllabus</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{font-family:Arial;background:#f4f6f8}
.box{
  max-width:500px;
  margin:40px auto;
  background:#fff;
  padding:20px;
  border-radius:8px;
}
select,button{
  width:100%;
  padding:10px;
  margin-top:10px;
}
button{
  background:#004aad;
  color:#fff;
  border:none;
  cursor:pointer;
}
</style>
</head>

<body>

<div class="box">
  <h2>📘 Syllabus Check</h2>

  <select id="course">
    <option value="">Select Course</option>
    <option value="A.N.M">A.N.M</option>
    <option value="B.tech">B.Tech</option>
    <option value="BBA">BBA</option>
    <option value="BCA">BCA</option>
    <option value="B.com">B.com</option>
    <option value="BA">BA</option>
    <option value="Bsc">Bsc</option>
    <option value="BS.LLB">BS.LLB</option>
    <option value="Bsc Nursing">Bsc Nursing</option>
    <option value="Bsc.Ag">Bsc.Ag</option>
    <option value="B.Pharma">B.Pharma</option>
    <option value="D.Pharma">D.Pharma</option>
    <option value="GNM">GNM</option>
    <option value="LLB">LLB</option>
    <option value="LAW">LAW</option>
    <option value="MCA">MCA</option>
    <option value="M,com">M,com</option>
    <option value="MBA">MBA</option>
    <option value="M.tech">M.tech</option>
    <option value="M.tech">M.tech</option>
  </select>

  <button onclick="openSyllabus()">Open PDF</button>
</div>

<script>
function openSyllabus(){

  const course = document.getElementById("course").value;

  if(course===""){
    alert("Please select course");
    return;
  }

  // 👇 course wise syllabus PDF mapping
  let pdf = "";

  if(course==="anm"){
    pdf = "pdf/anm.pdf";
  }
  else if(course==="btech"){
    pdf = "pdf/btech.pdf";
  }
  else if(course==="bba"){
    pdf = "pdf/bba.pdf";
  }
  else if(course==="bca"){
    pdf = "pdf/bca.pdf";
  }

  window.open(pdf,"_blank");
}
</script>

</body>
</html>
